const xp=x=>{let h=X[x.a]?`<br><span class="mut">কীভাবে এসেছে: ${X[x.a]}</span>`:"";if(x.c==="সমার্থক শব্দ"){const o=items.filter(y=>y.c===x.c&&y.b===x.b&&y.a!==x.a).map(y=>y.a);if(o.length)h+=`<br><span class="mut">${x.b}-এর অন্য সমার্থক শব্দ: ${o.join(", ")}</span>`}return h};
const S=(()=>{try{localStorage.setItem('x',1);return localStorage}catch(e){return{_:{},getItem(k){return this._[k]||null},setItem(k,v){this._[k]=v}}}})();
const items=[];for(const c in D)D[c].split("\n").forEach(l=>{const[a,b]=l.split("|");items.push({id:c+":"+a+"="+b,c,a,b})});
const byC=c=>c==="সব"?items:items.filter(x=>x.c===c);
let bm=JSON.parse(S.getItem("bm")||"[]");const save=()=>S.setItem("bm",JSON.stringify(bm));
let rd=JSON.parse(S.getItem("rd")||"[]");const isR=id=>rd.includes(id);const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
let lg=JSON.parse(S.getItem("rdlog")||"{}"),tg=parseInt(S.getItem("tg"))||10;
const todayIds=()=>lg[today()]||[];
const todayItems=()=>todayIds().map(id=>items.find(x=>x.id===id)).filter(Boolean);
function updTg(){const b=document.getElementById("tgb");if(b)b.textContent="🎯 আজ "+bn(todayIds().length)+"/"+bn(tg)}
const togR=id=>{rd=isR(id)?rd.filter(x=>x!==id):[...rd,id];S.setItem("rd",JSON.stringify(rd));
const t=today();let a=lg[t]||[];if(isR(id)){if(!a.includes(id))a.push(id)}else a=a.filter(x=>x!==id);lg={[t]:a};S.setItem("rdlog",JSON.stringify(lg));updTg()};
const isB=id=>bm.includes(id);const tog=id=>{bm=isB(id)?bm.filter(x=>x!==id):[...bm,id];save()};
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const $=document.getElementById("m");let tab="p",cat="সব";
const prompt=x=>x.c==="বিভ্রান্তিমূলক শব্দ"?"“"+x.a+"” শব্দের অর্থ কোনটি?":x.c==="বাগধারা"?"“"+x.a+"” অর্থ কী?":x.c==="এক কথায় প্রকাশ"?"এক কথায়: "+x.a:"“"+x.a+"” শব্দটির সমার্থক শব্দ/অর্থ কোনটি?";
const answer=x=>x.b;
function mk(x){const pool=[...new Set(byC(x.c).map(answer))].filter(v=>v!==x.b);const o=shuf([x.b,...shuf(pool).slice(0,3)]);return{x,o}}
const catSel=()=>`<select id="cs">${["সব",...Object.keys(D)].map(c=>`<option ${c===cat?"selected":""}>${c}</option>`).join("")}</select>`;
const star=x=>`<button class="star ${isB(x.id)?"on":""}" data-s="${x.id}" aria-label="বুকমার্ক">★</button>`;
function nav(t){tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>nav(b.dataset.t));
document.getElementById("tgb").onclick=()=>nav("t");
let St={p:null,r:null,t:null},pn={p:0,r:0,t:0},E=null;
function render(){so=false;updTg();tab==="t"?target():tab==="td"?pr(2):tab==="s"?study():tab==="p"?pr(0):tab==="r"?pr(1):tab==="e"?ex():bk()}
function pr(rev){const k=rev===2?"t":rev?"r":"p";let S=St[k];
if(!S){const p=rev===2?todayItems():rev?byC(cat).filter(x=>isR(x.id)):byC(cat);S={qs:shuf(p).slice(0,10).map(mk),a:{},n:pn[k]+1};if(S.qs.length)St[k]=S}
const tot=byC(cat).length,rc=byC(cat).filter(x=>isR(x.id)).length;
const head=`<div class="card"><div class="row">${rev===2?'<button class="btn" id="bt">← টার্গেট</button>':catSel()}<span class="mut">${rev===2?"আজকের রিভিশন":rev?"রিভিশন":"অনুশীলন"} · পৃষ্ঠা ${S.n}</span><span class="tag" id="sc" style="margin-left:auto"></span></div><div class="mut" style="margin-top:6px">${rev===2?"আজ পড়া হয়েছে: "+todayIds().length:"পড়া হয়েছে: "+rc+" / "+tot}</div></div>`;
if(!S.qs.length){$.innerHTML=head+`<div class="card"><div class="q">রিভিশনের জন্য কিছু নেই</div><p class="mut">অনুশীলনে প্রশ্নের পাশে “পড়া হয়েছে?” চাপলে সেটি এখানে রিভিশনে আসবে।</p></div>`;bindCs(k);return}
const upd=()=>{const d=Object.keys(S.a).length,c=S.qs.filter((z,j)=>S.a[j]===z.x.b).length;$.querySelector("#sc").textContent=`সঠিক ${c}/${d}`};
$.innerHTML=head+S.qs.map((q,i)=>`<div class="card" data-i="${i}"><div class="row"><span class="tag">${i+1}. ${q.x.c}</span><button class="rdb ${isR(q.x.id)?"on":""}">${isR(q.x.id)?"✓ পড়া হয়েছে":"পড়া হয়েছে?"}</button>${star(q.x)}</div><div class="q">${prompt(q.x)}</div>${q.o.map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join("")}<div class="fb"></div></div>`).join("")+
`<div class="row" style="justify-content:center;margin-bottom:24px"><button class="btn p" id="nx">পরের ১০টি প্রশ্ন →</button></div>`;
bindCs(k);upd();
$.querySelector("#nx").onclick=()=>{pn[k]=S.n;St[k]=null;pr(rev);scrollTo(0,0)};
$.querySelectorAll(".card[data-i]").forEach(c=>{const i=+c.dataset.i,q=S.qs[i];
const paint=()=>{c.querySelectorAll(".opt").forEach(o=>{if(o.dataset.v===q.x.b)o.classList.add("ok");else if(o.dataset.v===S.a[i])o.classList.add("no")});
c.querySelector(".fb").innerHTML=`<p><b>${S.a[i]===q.x.b?"সঠিক!":"ভুল।"}</b> ${q.x.a} = ${q.x.b}${xp(q.x)}</p>`;upd()};
if(i in S.a)paint();
c.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{if(i in S.a)return;S.a[i]=o.dataset.v;paint()});
c.querySelector(".star").onclick=e=>{tog(q.x.id);e.target.classList.toggle("on")};
c.querySelector(".rdb").onclick=e=>{togR(q.x.id);const on=isR(q.x.id);e.target.classList.toggle("on",on);e.target.textContent=on?"✓ পড়া হয়েছে":"পড়া হয়েছে?"}})}
function target(){const n=todayIds().length,pct=Math.min(100,Math.round(n/tg*100)),l=todayItems();
$.innerHTML=`<div class="card"><div class="q">আজকের টার্গেট</div><div class="mut">${new Date().toLocaleDateString("bn-BD")}</div><div class="bar"><i style="width:${pct}%"></i></div><p><b>${bn(n)} / ${bn(tg)}</b> প্রশ্ন পড়া হয়েছে${n>=tg?" 🎉 টার্গেট পূর্ণ!":""}</p><div class="row"><input id="ti" class="inp" type="number" min="1" max="1000" value="${tg}"><button class="btn p" id="ts">টার্গেট সেট করুন</button></div><p class="mut">প্রতিদিন টার্গেটের গণনা নতুন করে শুরু হয়।</p></div>
<div class="card"><div class="row"><b>আজকের পড়া প্রশ্ন (${bn(n)})</b>${n?'<button class="btn p" id="tr" style="margin-left:auto">রিভিশন দিন</button>':""}</div>${n?l.map(x=>`<div class="bm"><div><span class="tag">${x.c}</span><br><b>${x.a}</b> — ${x.b}${xp(x)}</div></div>`).join(""):'<p class="mut">আজ এখনও কোনো প্রশ্ন “পড়া হয়েছে” মার্ক করা হয়নি।</p>'}</div>`;
$.querySelector("#ts").onclick=()=>{tg=Math.max(1,parseInt($.querySelector("#ti").value)||10);S.setItem("tg",tg);updTg();target()};
const tr=$.querySelector("#tr");if(tr)tr.onclick=()=>{St.t=null;pn.t=0;tab="td";render()}}
let sg=null,so=false;
function study(){const gs=[...new Set(items.filter(x=>x.c==="সমার্থক শব্দ").map(x=>x.b))];if(!sg||!gs.includes(sg))sg=gs[0];
const list=items.filter(x=>x.c==="সমার্থক শব্দ"&&x.b===sg);
$.innerHTML=`<div class="card" style="position:relative"><div class="mut" style="margin-bottom:6px">বিষয় বেছে নিন (${gs.length}টি)</div><button class="btn dd" id="ddb" aria-expanded="${so}">${sg} <span>${so?"▲":"▼"}</span></button>${so?`<div class="ddl" role="listbox">${gs.map(g=>`<button class="ddi ${g===sg?"on":""}" data-g="${g}">${g}</button>`).join("")}</div>`:""}</div>
<div class="card"><div class="q">${sg} <span class="mut">— ${list.length}টি সমার্থক শব্দ</span></div>${list.map((x,i)=>`<div class="bm" data-i="${i}"><div style="flex:1"><b>${x.a}</b>${X[x.a]?`<br><span class="mut">কীভাবে এসেছে: ${X[x.a]}</span>`:""}</div><button class="rdb ${isR(x.id)?"on":""}">${isR(x.id)?"✓ পড়া হয়েছে":"পড়া হয়েছে?"}</button>${star(x)}</div>`).join("")}</div>`;
$.querySelector("#ddb").onclick=()=>{so=!so;study()};
$.querySelectorAll(".ddi").forEach(b=>b.onclick=()=>{sg=b.dataset.g;so=false;study();scrollTo(0,0)});
$.querySelectorAll(".bm").forEach(r=>{const x=list[+r.dataset.i];
r.querySelector(".star").onclick=e=>{tog(x.id);e.target.classList.toggle("on")};
r.querySelector(".rdb").onclick=e=>{togR(x.id);const on=isR(x.id);e.target.classList.toggle("on",on);e.target.textContent=on?"✓ পড়া হয়েছে":"পড়া হয়েছে?"}})}
function bindCs(k){const c=$.querySelector("#cs");if(c)c.onchange=e=>{cat=e.target.value;pn.p=pn.r=0;St.p=St.r=null;render()};const bt=$.querySelector("#bt");if(bt)bt.onclick=()=>{tab="t";render()}}
function ex(){if(!E){$.innerHTML=`<div class="card"><div class="q">পরীক্ষা দিন</div><p class="mut">প্রতিটি প্রশ্নের চারটি অপশন। শেষে ফলাফল ও ভুলগুলো দেখুন।</p><div class="row">${catSel()}<select id="n"><option>10</option><option>20</option><option>30</option></select><button class="btn p" id="go">শুরু করুন</button></div></div>`;
$.querySelector("#cs").onchange=e=>cat=e.target.value;
$.querySelector("#go").onclick=()=>{const n=+$.querySelector("#n").value;E={qs:shuf(byC(cat)).slice(0,n).map(mk),i:0,a:[]};ex()};return}
if(E.i>=E.qs.length){const sc=E.qs.filter((q,i)=>E.a[i]===q.x.b).length;
$.innerHTML=`<div class="card"><div class="q">ফলাফল: ${sc} / ${E.qs.length}</div><div class="row"><button class="btn p" id="re">নতুন পরীক্ষা</button></div></div>`+
E.qs.map((q,i)=>{const r=E.a[i]===q.x.b;return`<div class="card"><div class="row"><span class="tag">${r?"সঠিক":"ভুল"}</span>${star(q.x)}</div><div class="q" style="font-size:1.1rem">${prompt(q.x)}</div><p>সঠিক উত্তর: <b>${q.x.b}</b>${xp(q.x)}${r?"":`<br><span class="mut">আপনার উত্তর: ${E.a[i]}</span>`}</p></div>`}).join("");
$.querySelector("#re").onclick=()=>{E=null;ex()};$.querySelectorAll(".star").forEach(s=>s.onclick=()=>{tog(s.dataset.s);s.classList.toggle("on")});return}
const q=E.qs[E.i];
$.innerHTML=`<div class="card"><div class="mut">প্রশ্ন ${E.i+1} / ${E.qs.length}</div><div class="q">${prompt(q.x)}</div>${q.o.map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join("")}</div>`;
$.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{E.a[E.i++]=b.dataset.v;ex()})}
function bk(){const l=items.filter(x=>isB(x.id));
$.innerHTML=l.length?`<div class="card">${l.map(x=>`<div class="bm"><div><span class="tag">${x.c}</span><br><b>${x.a}</b> — ${x.b}${xp(x)}</div>${star(x)}</div>`).join("")}</div>`:`<div class="card"><div class="q">কোনো বুকমার্ক নেই</div><p class="mut">অনুশীলন বা পরীক্ষার ফলাফল পাতায় ★ চাপলে এখানে জমা হবে।</p></div>`;
$.querySelectorAll(".star").forEach(s=>s.onclick=()=>{tog(s.dataset.s);bk()})}
render();
</script></body></html>
